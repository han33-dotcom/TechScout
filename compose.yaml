x-backend: &backend
  image: "techscout-${COMPOSE_PROJECT_NAME}:local"
  pull_policy: never
  environment: &database
    TECHSCOUT_DB_HOST: db
    POSTGRES_USER: ${POSTGRES_USER:-techscout}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB:-techscout}

x-app-env: &app-env
  <<: *database
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}

services:
  db:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-techscout}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  app:
    <<: *backend
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - evidence:/var/lib/techscout/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.ingestion_worker"]
    environment: *app-env
    volumes:
      - evidence:/var/lib/techscout/evidence
    healthcheck:
      test: ["CMD", "python", "-m", "app.ingestion_worker", "--check"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  evidence:
