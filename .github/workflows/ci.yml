name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: techscout
          POSTGRES_PASSWORD: techscout
          POSTGRES_DB: techscout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techscout -d techscout_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Tests (SQLite)
        run: python -m unittest discover -s tests -v
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://techscout:techscout@localhost:5432/techscout_test
        run: python -m unittest discover -s tests -v
      - name: Migrate and load fixtures (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://techscout:techscout@localhost:5432/techscout_test
        run: |
          alembic upgrade head
          python -m app.storage load-fixtures

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t techscout:ci .
