name: Team task
description: Scoped work with acceptance criteria and dependencies
title: "[Task] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and scope
      description: Describe what should work and the limits of this task.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use checkboxes for observable outcomes and edge cases.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [High, Medium, Low]
      default: 1
  - type: input
    id: due
    attributes:
      label: Due date
      description: Optional YYYY-MM-DD.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link related issues and required implementation PRs. Explain blockers.
  - type: textarea
    id: evidence
    attributes:
      label: Completion evidence
      description: Record passing checks, demonstrated criteria and the merged PR before the author closes the issue.
